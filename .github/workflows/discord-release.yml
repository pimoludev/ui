name: Discord release notification

# TEMPORARY: workflow_dispatch and the input fallbacks below are only for the
# manual webhook check. Remove them once the maintainer confirms the embed.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      title:
        description: "Embed title"
        required: false
        default: "Pimolu UI — test de notification"
      description:
        description: "Embed description"
        required: false
        default: "Test du webhook Discord. Ce message est envoyé par le workflow de notification de release."
      tag:
        description: "Tag shown in the embed"
        required: false
        default: "v0.0.0-test"
      url:
        description: "Release URL"
        required: false
        default: "https://github.com/pimoludev/ui/releases"
      prerelease:
        description: "Use the beta install command"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  notify:
    name: Post the release embed to Discord
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the release embed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TITLE: ${{ github.event.release.name || inputs.title }}
          RELEASE_BODY: ${{ github.event.release.body || inputs.description }}
          RELEASE_URL: ${{ github.event.release.html_url || inputs.url }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || github.event.release.prerelease }}
        run: |
          set -euo pipefail

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping the Discord notification."
            exit 0
          fi

          channel="latest"
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            channel="beta"
          fi

          payload=$(jq -n \
            --arg title "$RELEASE_TITLE" \
            --arg body "$RELEASE_BODY" \
            --arg url "$RELEASE_URL" \
            --arg tag "$RELEASE_TAG" \
            --arg channel "$channel" \
            --argjson color 5195493 \
            '{
              username: "Pimolu UI",
              embeds: [{
                title: (if ($title // "") == "" then $tag else $title end),
                description: (if ($body // "") == "" then "Release notes: " + $url else $body[:4096] end),
                url: $url,
                color: $color,
                fields: [
                  { name: "Tag", value: $tag, inline: true },
                  { name: "Install", value: ("npm install @pimolu/react@" + $channel + " @pimolu/web-styles@" + $channel), inline: false }
                ],
                footer: { text: "Pimolu UI · GitHub Release" }
              }]
            }')

          curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
