name: Discord release notification

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    name: Post the release embed to Discord
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the release embed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping the Discord notification."
            exit 0
          fi

          channel="latest"
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            channel="beta"
          fi

          payload=$(jq -n \
            --arg title "$RELEASE_TITLE" \
            --arg body "$RELEASE_BODY" \
            --arg url "$RELEASE_URL" \
            --arg tag "$RELEASE_TAG" \
            --arg channel "$channel" \
            --argjson color 5195493 \
            '{
              username: "Pimolu UI",
              embeds: [{
                title: (if ($title // "") == "" then $tag else $title end),
                description: (if ($body // "") == "" then "Release notes: " + $url else $body[:4096] end),
                url: $url,
                color: $color,
                fields: [
                  { name: "Tag", value: $tag, inline: true },
                  { name: "Install", value: ("npm install @pimolu/react@" + $channel + " @pimolu/web-styles@" + $channel), inline: false }
                ],
                footer: { text: "Pimolu UI · GitHub Release" }
              }]
            }')

          curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
